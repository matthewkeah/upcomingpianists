<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KCPO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- EmailJS SDK for Admin Email Notifications -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark brand-bar border-bottom p-3">
        <div class="container">
            <span class="navbar-brand fw-bold">KCPO <span class="fw-normal text-muted-c">| Admin Console</span></span>
            <button class="btn btn-outline-danger btn-sm" onclick="logoutUser()">Sign Out</button>
        </div>
    </nav>

    <main class="container-fluid py-5 d-none" id="adminContent">
        <div class="row g-4 px-lg-4">
            
            <!-- LEFT COLUMN: Directory Search -->
            <div class="col-lg-4 col-xl-3 border-end border-secondary">
                <h5 class="accent-gold mb-3"><i class="bi bi-people-fill me-2"></i>Member Directory</h5>
                <input type="text" class="form-control field mb-3" id="adminMemberSearch" placeholder="Search members by name...">
                <button class="btn btn-outline-gold w-100 mb-3" onclick="setComposerTarget('all', 'All Members', 'all')">Broadcast to All</button>
                <div class="list-group list-group-flush overflow-auto pe-2" id="adminMemberList" style="max-height: 65vh;">
                    <!-- JS Injected List -->
                </div>
            </div>

            <!-- RIGHT COLUMN: Composer & Tables -->
            <div class="col-lg-8 col-xl-9">
                <div class="card kcpo-card p-4 mb-5 border-gold">
                    <h5 class="mb-4 d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-megaphone me-2 accent-gold"></i><span id="composerTargetLabel">Broadcasting to: All Members</span></span>
                        <span class="badge bg-danger d-none" id="composerPrivateBadge">Private Direct Message</span>
                    </h5>
                    
                    <form id="adminBroadcastForm">
                        <input type="hidden" id="broadcastTargetUid" value="all">
                        <input type="hidden" id="broadcastTargetEmail" value="all">
                        
                        <div class="mb-3">
                            <label class="form-label text-muted-c small">Subject / Title</label>
                            <input type="text" class="form-control field" id="broadcastTitle" required placeholder="e.g. Venue Change for September Session">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted-c small">Message Body</label>
                            <textarea class="form-control field" id="broadcastMessage" rows="5" required placeholder="Write your announcement or direct message here..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted-c small"><i class="bi bi-paperclip me-1"></i> Attach Media (Images, PDFs, Videos, Docs)</label>
                            <input type="file" class="form-control field" id="broadcastMedia" multiple>
                        </div>

                        <div id="broadcastStatus" class="alert d-none small"></div>
                        
                        <button type="submit" class="btn btn-gold w-100 py-2" id="btnSendBroadcast">Publish & Send Email Notification</button>
                    </form>
                </div>

                <!-- Existing Management Tabs -->
                <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#users" type="button">Manage Users</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#feedback" type="button">Review Feedback</button></li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="users"><table class="table table-kcpo table-hover"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead><tbody id="adminUserTableBody"></tbody></table></div>
                    <div class="tab-pane fade" id="feedback"><table class="table table-kcpo table-hover"><thead><tr><th>Sender</th><th>Piece & Performer</th><th>Snippet</th><th>Actions</th></tr></thead><tbody id="adminFeedbackTableBody"></tbody></table></div>
                </div>
            </div>
            
        </div>
    </main>
    
    <div class="container py-5 text-center" id="accessDeniedMsg">
        <h3 class="text-danger">Access Denied</h3>
        <p class="text-muted-c">Verifying administrative privileges...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
