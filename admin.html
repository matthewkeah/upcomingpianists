<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KCPO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark brand-bar border-bottom p-3">
        <div class="container">
            <span class="navbar-brand fw-bold">KCPO <span class="fw-normal text-muted-c">| Admin Console</span></span>
            <button class="btn btn-outline-danger btn-sm" id="adminLogoutBtn">Sign Out</button>
        </div>
    </nav>

    <main class="container py-5 d-none" id="adminContent">
        <h2 class="accent-gold mb-4">Platform Administration</h2>
        
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#users" type="button">Manage Users</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#feedback" type="button">Review Feedback</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- User Management Tab -->
            <div class="tab-pane fade show active" id="users">
                <div class="table-responsive">
                    <table class="table table-kcpo table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminUserTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Feedback Management Tab -->
            <div class="tab-pane fade" id="feedback">
                <div class="table-responsive">
                    <table class="table table-kcpo table-hover align-middle">
                        <thead>
                            <tr>
                                <th>From</th>
                                <th>To (Performer)</th>
                                <th>Comment Snippet</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminFeedbackTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    
    <div class="container py-5 text-center" id="accessDeniedMsg">
        <h3 class="text-danger">Access Denied</h3>
        <p class="text-muted-c">Verifying administrative privileges...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
